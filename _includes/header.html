<a class="skip-link" href="#main-content">跳到正文</a>
<header class="site-header"><div class="header-inner">
  <a class="site-brand" rel="author" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
  <button id="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" hidden>菜单 <span aria-hidden="true">☰</span></button>
  <nav id="site-nav" aria-label="主导航">
    {% for link in site.navigation_links %}
      {% assign active = false %}
      {% if page.url == link.url %}{% assign active = true %}{% elsif link.url != '/' and page.url contains link.url %}{% assign active = true %}{% endif %}
      <a href="{{ link.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ link.title | escape }}</a>
    {% endfor %}
  </nav>
</div></header>
