<header class="site-header" role="banner">
  <div class="wrapper">
    <div class="header-content">
      <a class="site-title" rel="author" href="/">{{ site.title | escape }}</a>
      
      <!-- 添加自定义logo，如果有的话 -->
      {% if site.logo %}
      <a class="site-logo" href="/">
        <img src="{{ site.logo }}" alt="{{ site.title }}" />
      </a>
      {% endif %}
      
      <nav class="site-nav">
        <input type="checkbox" id="nav-trigger" class="nav-trigger" />
        <label for="nav-trigger" class="nav-toggle">
          <span class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </label>

        <div class="nav-menu">
          <!-- 导航链接 -->
          <a class="nav-link" href="/">首页</a>
          <a class="nav-link" href="/posts/">文章</a>
          <a class="nav-link" href="/stories/">故事</a>
          <a class="nav-link" href="/notes/">笔记</a>
          <a class="nav-link" href="/moments/">时刻</a>
          <a class="nav-link" href="/about/">关于</a>
          
          <!-- 社交媒体图标 -->
          <div class="social-links">
            {% if site.github_username %}
            <a href="https://github.com/{{ site.github_username }}" target="_blank" title="GitHub" class="social-link">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
              </svg>
            </a>
            {% endif %}
          </div>
        </div>
      </nav>
    </div>
  </div>
</header>

<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']]
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script"></script>
