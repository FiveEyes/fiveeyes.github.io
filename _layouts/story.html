---
layout: base
---
<article class="bg-white rounded-lg shadow-md p-6 md:p-8 lg:p-10" {% if page.lang == "en" %}lang="en"{% endif %}>

  <header class="mb-8 text-center">
    <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-2">{{ page.title | escape }}</h1>
    <p class="text-gray-600">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%B %d, %Y" }}
      </time>
      {% if page.author %}
        <span class="mx-2">•</span>
        <span>{{ page.author }}</span>
      {% endif %}
    </p>
  </header>

  <div class="prose prose-lg max-w-none mx-auto" {% if page.lang == "en" %}lang="en"{% endif %}>
    {{ content }}
  </div>

  {% if page.tags.size > 0 %}
    <footer class="mt-8 pt-6 border-t border-gray-200">
      <div class="flex flex-wrap items-center">
        <span class="text-gray-700 font-semibold mr-3">Tags:</span>
        {% for tag in page.tags %}
          <a href="{{ '/tags' | relative_url }}#{{ tag | slugify }}" class="mr-2 mb-2 bg-gray-200 text-gray-700 text-sm font-medium px-2.5 py-0.5 rounded-full">{{ tag }}</a>
        {% endfor %}
      </div>
    </footer>
  {% endif %}

</article>
