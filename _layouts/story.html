---
layout: default
---
<article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting" {% if page.lang == "en" %}lang="en"{% endif %}>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
        {{ page.date | date: "%Y-%m-%d" }}
      </time>
      {% if page.author %}
        • <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span class="p-author h-card" itemprop="name">{{ page.author }}</span></span>
      {% endif %}
    </p>
  </header>

  {% if page.tags.size > 0 %}
    <div class="story-tags">
      {% for tag in page.tags %}
        <span class="story-tag">{{ tag }}</span>
      {% endfor %}
    </div>
  {% endif %}

  <div class="post-content e-content" itemprop="articleBody" {% if page.lang == "en" %}lang="en"{% endif %}>
    {{ content }}
  </div>

  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
</article>

<link rel="stylesheet" href="/assets/css/story.css">
