---
layout: base
---
<article class="reading-page">

  <header class="reading-heading">
    <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-2">{{ page.title | escape }}</h1>
    <p class="text-gray-600">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%Y.%m.%d %H:%M" }}
      </time>
    </p>
  </header>

  <div class="prose reading-body">
    {{ content }}
  </div>

  {% if page.tags.size > 0 %}
    <footer class="mt-8 pt-6 border-t border-gray-200">
      <div class="flex flex-wrap items-center">
        <span class="text-gray-700 font-semibold mr-3">标签：</span>
        {% for tag in page.tags %}
          <a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}" class="mr-2 mb-2 bg-gray-200 text-gray-700 text-sm font-medium px-2.5 py-0.5 rounded-full">{{ tag }}</a>
        {% endfor %}
      </div>
    </footer>
  {% endif %}

</article>
