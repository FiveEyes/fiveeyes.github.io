---
layout: base
---
<div class="standard-page">

  <header class="page-heading">
    <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-2">{{ page.title | escape }}</h1>
    {% if page.description %}
      <p class="text-xl text-gray-600 mt-4">{{ page.description | escape }}</p>
    {% endif %}
  </header>

  <div class="prose page-body">
    {{ content }}
  </div>

</div>
