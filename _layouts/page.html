---
layout: default
---
<div class="page">
  <header class="page-header">
    <h1 class="page-title">{{ page.title | escape }}</h1>
    {% if page.description %}
      <p class="page-description">{{ page.description | escape }}</p>
    {% endif %}
  </header>

  <div class="page-content">
    {{ content }}
  </div>
</div>

<style>
  .page {
    max-width: 100%;
  }
  
  .page-header {
    margin-bottom: 1.5rem;
    text-align: center;
    padding-bottom: 0;
  }
  
  /* .page-title 样式已移至主样式文件进行统一管理 */
  
  .page-description {
    font-size: 1.1em;
    color: #586069;
    margin: 0;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
  }
  
  .page-content {
    margin-top: 2rem;
  }
  
  @media (max-width: 768px) {
    .page-header {
      margin-bottom: 1.5rem;
      text-align: left;
    }
    
    .page-description {
      text-align: left;
    }
    
    .page-content {
      margin-top: 1.5rem;
    }
  }
  
  @media (max-width: 480px) {
    .page-description {
      font-size: 1em;
    }
  }
</style>
