---
layout: default
---
<div class="page">
  <header class="page-header">
    <h1 class="page-title">{{ page.title | escape }}</h1>
    {% if page.description %}
      <p class="page-description">{{ page.description | escape }}</p>
    {% endif %}
  </header>

  <div class="page-content">
    {{ content }}
  </div>
</div>

<style>
  .page {
    max-width: 100%;
  }
  
  .page-header {
    margin-bottom: 2rem;
    text-align: center;
    padding-bottom: 1rem;
    border-bottom: 2px solid #eaecef;
  }
  
  .page-title {
    font-size: 2.5em;
    font-weight: bold;
    color: #24292e;
    margin-bottom: 0.5rem;
    line-height: 1.2;
  }
  
  .page-description {
    font-size: 1.1em;
    color: #586069;
    margin: 0;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
  }
  
  .page-content {
    margin-top: 2rem;
  }
  
  @media (max-width: 768px) {
    .page-header {
      margin-bottom: 1.5rem;
      text-align: left;
    }
    
    .page-title {
      font-size: 2em;
    }
    
    .page-description {
      text-align: left;
    }
    
    .page-content {
      margin-top: 1.5rem;
    }
  }
  
  @media (max-width: 480px) {
    .page-title {
      font-size: 1.7em;
    }
    
    .page-description {
      font-size: 1em;
    }
  }
</style>
