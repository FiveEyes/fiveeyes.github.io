---
layout: base
---
<div class="bg-white rounded-lg shadow-md p-6 md:p-8 lg:p-10">

  <header class="mb-8 text-center">
    <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-2">{{ page.title | escape }}</h1>
    {% if page.description %}
      <p class="text-xl text-gray-600 mt-4">{{ page.description | escape }}</p>
    {% endif %}
  </header>

  <div class="prose prose-lg max-w-none mx-auto">
    {{ content }}
  </div>

</div>
